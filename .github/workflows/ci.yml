name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ImageConverter.sln -p:Platform=x64 --nologo

      - name: Build
        run: dotnet build ImageConverter.sln -c Release -p:Platform=x64 --no-restore --nologo

      - name: Test
        run: dotnet test tests/ImageConverter.Core.Tests/ImageConverter.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo --logger "trx;LogFileName=tests.trx"

      - name: Publish self-contained app
        run: dotnet publish src/ImageConverter.App/ImageConverter.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore -o artifacts/publish --nologo

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverter-win-x64
          path: artifacts/publish
          if-no-files-found: error
