name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore ImageConverter.sln -p:Platform=x64 --nologo
          dotnet build ImageConverter.sln -c Release -p:Platform=x64 --no-restore --nologo
          dotnet test tests/ImageConverter.Core.Tests/ImageConverter.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore --nologo

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/ImageConverter.App/ImageConverter.App.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true --no-restore -p:Version=$version -o artifacts/publish --nologo
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/ImageConverter-win-x64.zip -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup executable
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" installer/ImageConverter.iss

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            'artifacts/ImageConverter-win-x64.zip',
            'artifacts/installer/ImageConverter-Setup.exe'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            artifacts/installer/ImageConverter-Setup.exe `
            artifacts/ImageConverter-win-x64.zip `
            artifacts/SHA256SUMS.txt `
            THIRD-PARTY-NOTICES.md `
            --verify-tag --generate-notes --title "Image Converter ${{ github.ref_name }}"
